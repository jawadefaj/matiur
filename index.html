<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Production builds load Phaser from the CDN (dev uses node_modules). -->
    <script type="importmap">
      { "imports": { "phaser": "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.min.js" } }
    </script>
    <!-- Phone setup: no pinch zoom, page drawn edge to edge under the notch
         (#game below stays inside the safe area), and no browser bars when the
         game is saved to the home screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1d1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- These two files live in assets/public/. Vite serves that folder at the
         site root (publicDir in vite.config.ts). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- "Press Start 2P" is the pixel font for all game text (FONT in src/config.ts).
         src/main.ts waits for it to load before starting the game. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" />
    <title>Wings of Freedom</title>
    <style>
      /* Lock the page so every touch goes to the game: no scrolling,
         pull-to-refresh, text selection or tap highlight. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111214;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The game fills the screen inside the safe area (clear of the notch
         and the home bar), above the ad banner. Phaser scales the canvas to fit. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        /* --ad-banner-h is set by src/core/ads/AdManager.ts while a banner shows. */
        bottom: calc(env(safe-area-inset-bottom, 0px) + var(--ad-banner-h, 0px));
        left: env(safe-area-inset-left, 0px);
      }
      #game canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <!-- Phaser puts its canvas in #game, and the video player its overlay. src/main.ts is the entry point. -->
    <div id="game"></div>
    <!-- If the game fails to start (an old browser, no graphics support), show
         why instead of a blank page. A plain script, so it runs even when the
         game's module cannot load. -->
    <script>
      (function () {
        function show(msg) {
          if (document.querySelector('#game canvas') || document.getElementById('boot-error')) return;
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText =
            'position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;' +
            'color:#e8e2c8;font:14px/1.5 monospace;background:#111214;text-align:center;z-index:9';
          box.innerHTML = '<b style="color:#e8c547">The game could not start on this browser.</b>' +
            '<span>Try the latest Chrome, Safari or Firefox, outside apps such as WhatsApp or Facebook.</span>';
          var detail = document.createElement('small');
          detail.style.opacity = '0.6';
          detail.textContent = String(msg || 'Unknown error');
          box.appendChild(detail);
          document.body.appendChild(box);
        }
        window.addEventListener('error', function (e) { show(e.message); });
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
